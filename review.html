<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review your receipt | Chloeat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Chloe<span>at</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
        </nav>

    </header>


    <main>

        <section class="review-page">

            <div class="section-header">

                <p class="small-title">
                    STEP 3
                </p>

                <h1>
                    Here's what we found.
                </h1>

                <p id="review-description">
                    Check the groceries Chloeat found on your receipt.
                </p>

            </div>


            <!-- ==============================
                 OCR RESULT
            ============================== -->

            <div
                class="review-list"
                id="review-list"
            >

            </div>


            <!-- ==============================
                 ADD GROCERY
            ============================== -->

            <button
                type="button"
                class="add-item-button"
                id="add-item"
            >
                + Add another grocery
            </button>


            <!-- ==============================
                 CONTINUE
            ============================== -->

            <button
                type="button"
                class="plan-button"
                id="continue-button"
            >
                Continue to My Kitchen
            </button>

        </section>

    </main>


    <footer>

        <p>
            Made with care by Chloeat
        </p>

    </footer>


    <script>

        /*
         * GET THE OCR TEXT
         */

        const receiptText =
            localStorage.getItem("receiptText");


        const reviewList =
            document.getElementById("review-list");


        const reviewDescription =
            document.getElementById("review-description");


        /*
         * TURN OCR TEXT INTO LINES
         */

        let lines = [];


        if (receiptText) {

            lines =
                receiptText
                    .split("\n")
                    .map(function (line) {

                        return line.trim();

                    })
                    .filter(function (line) {

                        return line.length > 1;

                    });

        }


        /*
         * REMOVE OBVIOUS RECEIPT INFORMATION
         */

        const ignoredWords = [

            "total",
            "subtotal",
            "tax",
            "hst",
            "gst",
            "pst",
            "cash",
            "change",
            "credit",
            "debit",
            "visa",
            "mastercard",
            "thank",
            "welcome",
            "receipt",
            "balance",
            "payment",
            "amount",
            "discount"

        ];


        lines =
            lines.filter(function (line) {

                const lowerLine =
                    line.toLowerCase();


                return !ignoredWords.some(
                    function (word) {

                        return lowerLine.includes(word);

                    }
                );

            });


        /*
         * REMOVE LINES THAT ARE MOSTLY NUMBERS
         */

        lines =
            lines.filter(function (line) {

                const letters =
                    line.replace(
                        /[^a-zA-Z]/g,
                        ""
                    );


                return letters.length >= 2;

            });


        /*
         * LIMIT THE NUMBER OF ITEMS
         */

        lines =
            lines.slice(0, 30);


        /*
         * DISPLAY AN EMPTY RESULT
         */

        if (lines.length === 0) {

            reviewDescription.textContent =
                "Chloeat couldn't find any recognizable grocery items on this receipt. You can add them manually.";

            reviewList.innerHTML = `

                <div class="review-item">

                    <div>

                        <input
                            class="item-name"
                            type="text"
                            placeholder="Grocery name"
                        >

                        <input
                            class="item-quantity"
                            type="text"
                            placeholder="Quantity"
                        >

                    </div>

                    <button
                        type="button"
                        class="remove-button"
                    >
                        Remove
                    </button>

                </div>

            `;

        }


        /*
         * DISPLAY OCR RESULTS
         */

        else {

            lines.forEach(function (line) {

                createGroceryItem(
                    line,
                    ""
                );

            });

        }


        /*
         * CREATE A GROCERY ITEM
         */

        function createGroceryItem(
            name,
            quantity
        ) {

            const item =
                document.createElement("div");


            item.className =
                "review-item";


            item.innerHTML = `

                <div>

                    <input
                        class="item-name"
                        type="text"
                        value="${name}"
                    >

                    <input
                        class="item-quantity"
                        type="text"
                        value="${quantity}"
                        placeholder="Quantity"
                    >

                </div>


                <button
                    type="button"
                    class="remove-button"
                >
                    Remove
                </button>

            `;


            reviewList.appendChild(item);


            setupRemoveButton(
                item.querySelector(".remove-button")
            );

        }


        /*
         * REMOVE BUTTON
         */

        function setupRemoveButton(button) {

            button.addEventListener(
                "click",
                function () {

                    const item =
                        button.closest(
                            ".review-item"
                        );


                    item.remove();

                }
            );

        }


        /*
         * SET UP EXISTING REMOVE BUTTONS
         */

        document
            .querySelectorAll(".remove-button")
            .forEach(function (button) {

                setupRemoveButton(button);

            });


        /*
         * ADD GROCERY BUTTON
         */

        const addItemButton =
            document.getElementById("add-item");


        addItemButton.addEventListener(
            "click",
            function () {

                createGroceryItem(
                    "",
                    ""
                );


                const inputs =
                    reviewList.querySelectorAll(
                        ".item-name"
                    );


                inputs[
                    inputs.length - 1
                ].focus();

            }
        );


        /*
         * SAVE GROCERIES
         */

        const continueButton =
            document.getElementById(
                "continue-button"
            );


        continueButton.addEventListener(
            "click",
            function () {

                const items =
                    document.querySelectorAll(
                        ".review-item"
                    );


                const groceries = [];


                items.forEach(
                    function (item) {

                        const name =
                            item
                                .querySelector(
                                    ".item-name"
                                )
                                .value
                                .trim();


                        const quantity =
                            item
                                .querySelector(
                                    ".item-quantity"
                                )
                                .value
                                .trim();


                        if (name !== "") {

                            groceries.push({

                                name: name,

                                quantity: quantity

                            });

                        }

                    }
                );


                localStorage.setItem(
                    "groceries",
                    JSON.stringify(
                        groceries
                    )
                );


                window.location.href =
                    "kitchen.html";

            }
        );

    </script>

</body>

</html>
