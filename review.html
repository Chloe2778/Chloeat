<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review your receipt | Chloeat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Chloe<span>at</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
        </nav>

    </header>


    <main>

        <section class="review-page">

            <div class="section-header">

                <p class="small-title">STEP 3</p>

                <h1>Here's what we found.</h1>

                <p>
                    We've read your receipt and found these groceries.
                    Check everything before continuing.
                </p>

            </div>


            <div class="review-list">

                <div class="review-item">

                    <div>
                        <input
                            class="item-name"
                            type="text"
                            value="Chicken breast"
                        >

                        <input
                            class="item-quantity"
                            type="text"
                            value="1.24 kg"
                        >
                    </div>

                    <button
                        type="button"
                        class="remove-button"
                    >
                        Remove
                    </button>

                </div>


                <div class="review-item">

                    <div>
                        <input
                            class="item-name"
                            type="text"
                            value="Tomatoes"
                        >

                        <input
                            class="item-quantity"
                            type="text"
                            value="0.82 kg"
                        >
                    </div>

                    <button
                        type="button"
                        class="remove-button"
                    >
                        Remove
                    </button>

                </div>


                <div class="review-item">

                    <div>
                        <input
                            class="item-name"
                            type="text"
                            value="Eggs"
                        >

                        <input
                            class="item-quantity"
                            type="text"
                            value="12 units"
                        >
                    </div>

                    <button
                        type="button"
                        class="remove-button"
                    >
                        Remove
                    </button>

                </div>


                <div class="review-item">

                    <div>
                        <input
                            class="item-name"
                            type="text"
                            value="Broccoli"
                        >

                        <input
                            class="item-quantity"
                            type="text"
                            value="0.60 kg"
                        >
                    </div>

                    <button
                        type="button"
                        class="remove-button"
                    >
                        Remove
                    </button>

                </div>

            </div>


            <button
                type="button"
                class="add-item-button"
                id="add-item"
            >
                + Add another grocery
            </button>


            <button
                type="button"
                class="plan-button"
                id="continue-button"
            >
                Continue to My Kitchen
            </button>

        </section>

    </main>


    <footer>
        Made with care by Chloeat
    </footer>


    <script>

        /*
         * REMOVE AN ITEM
         */

        function setupRemoveButton(button) {

            button.addEventListener("click", function () {

                const item = button.closest(".review-item");

                item.remove();

            });

        }


        const removeButtons =
            document.querySelectorAll(".remove-button");


        removeButtons.forEach(function (button) {

            setupRemoveButton(button);

        });


        /*
         * ADD A NEW ITEM
         */

        const addItemButton =
            document.getElementById("add-item");


        addItemButton.addEventListener("click", function () {

            const newItem =
                document.createElement("div");

            newItem.className = "review-item";


            newItem.innerHTML = `

                <div>

                    <input
                        class="item-name"
                        type="text"
                        placeholder="Grocery name"
                    >

                    <input
                        class="item-quantity"
                        type="text"
                        placeholder="Quantity"
                    >

                </div>


                <button
                    type="button"
                    class="remove-button"
                >
                    Remove
                </button>

            `;


            document
                .querySelector(".review-list")
                .appendChild(newItem);


            setupRemoveButton(
                newItem.querySelector(".remove-button")
            );

        });


        /*
         * SAVE GROCERIES AND GO TO KITCHEN
         */

        const continueButton =
            document.getElementById("continue-button");


        continueButton.addEventListener("click", function () {

            const items =
                document.querySelectorAll(".review-item");


            const groceries = [];


            items.forEach(function (item) {

                const name =
                    item.querySelector(".item-name").value.trim();


                const quantity =
                    item.querySelector(".item-quantity").value.trim();


                if (name !== "") {

                    groceries.push({

                        name: name,

                        quantity: quantity

                    });

                }

            });


            localStorage.setItem(
                "groceries",
                JSON.stringify(groceries)
            );


            window.location.href = "kitchen.html";

        });

    </script>

</body>

</html>
