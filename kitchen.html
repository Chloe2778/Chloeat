<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Week | Chloeat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Chloe<span>at</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="kitchen.html">My Kitchen</a>
        </nav>

    </header>


    <main>

        <section class="week-page">

            <div class="section-header">

                <p class="small-title">STEP 5</p>

                <h1>Here's your week.</h1>

                <p id="week-description">
                    Chloeat created these meals using the groceries
                    currently in your kitchen.
                </p>

            </div>


            <!-- ==============================
                 WEEKLY PLAN
            ============================== -->

            <div
                class="weekly-plan"
                id="weekly-plan"
            >

            </div>


            <a
                href="kitchen.html"
                class="plan-button"
            >
                Back to My Kitchen
            </a>

        </section>

    </main>


    <footer>

        <p>
            Made with care by Chloeat
        </p>

    </footer>


    <script>

        /*
         * GET GROCERIES FROM YOUR KITCHEN
         */

        const savedGroceries =
            localStorage.getItem("groceries");


        const weeklyPlan =
            document.getElementById("weekly-plan");


        const weekDescription =
            document.getElementById("week-description");


        let groceries = [];


        if (savedGroceries) {

            groceries =
                JSON.parse(savedGroceries);

        }


        /*
         * IF THE KITCHEN IS EMPTY
         */

        if (groceries.length === 0) {

            weekDescription.textContent =
                "Your kitchen is empty, so Chloeat can't create a meal plan yet.";


            weeklyPlan.innerHTML = `

                <div class="meal-day">

                    <h3>
                        Nothing to cook yet
                    </h3>

                    <h4>
                        Your kitchen is empty
                    </h4>

                    <p>
                        Add some groceries to your kitchen
                        and Chloeat will build your week around them.
                    </p>

                </div>

            `;

        }


        /*
         * OTHERWISE, CREATE THE MEAL PLAN
         */

        else {


            /*
             * CREATE A SEARCHABLE LIST
             */

            const groceryNames =
                groceries
                    .map(function (grocery) {

                        return grocery.name
                            .toLowerCase()
                            .trim();

                    });


            /*
             * CHECK WHETHER AN INGREDIENT EXISTS
             */

            function hasIngredient(words) {

                return words.some(function (word) {

                    return groceryNames.some(function (grocery) {

                        return grocery.includes(word);

                    });

                });

            }


            /*
             * STORE POSSIBLE MEALS
             */

            const possibleMeals = [];


            /*
             * CHICKEN MEAL
             */

            if (
                hasIngredient([
                    "chicken",
                    "chicken breast",
                    "chicken thigh"
                ])
            ) {

                possibleMeals.push({

                    title: "Chicken Rice Bowl",

                    description:
                        "Chicken with rice and vegetables from your kitchen.",

                    ingredients:
                        "Uses your chicken"

                });

            }


            /*
             * EGG MEAL
             */

            if (
                hasIngredient([
                    "egg",
                    "eggs"
                ])
            ) {

                possibleMeals.push({

                    title: "Vegetable Omelette",

                    description:
                        "Eggs cooked with vegetables you already have.",

                    ingredients:
                        "Uses your eggs"

                });

            }


            /*
             * TOMATO MEAL
             */

            if (
                hasIngredient([
                    "tomato",
                    "tomatoes"
                ])
            ) {

                possibleMeals.push({

                    title: "Tomato Pasta",

                    description:
                        "Pasta with fresh tomatoes from your kitchen.",

                    ingredients:
                        "Uses your tomatoes"

                });

            }


            /*
             * BROCCOLI MEAL
             */

            if (
                hasIngredient([
                    "broccoli"
                ])
            ) {

                possibleMeals.push({

                    title: "Broccoli Rice Bowl",

                    description:
                        "Broccoli with rice and ingredients from your kitchen.",

                    ingredients:
                        "Uses your broccoli"

                });

            }


            /*
             * POTATO MEAL
             */

            if (
                hasIngredient([
                    "potato",
                    "potatoes"
                ])
            ) {

                possibleMeals.push({

                    title: "Roasted Potatoes",

                    description:
                        "Roasted potatoes with ingredients from your kitchen.",

                    ingredients:
                        "Uses your potatoes"

                });

            }


            /*
             * IF NO MEALS CAN BE CREATED
             */

            if (possibleMeals.length === 0) {

                weekDescription.textContent =
                    "Chloeat couldn't find enough recognizable ingredients to create a meal yet.";


                weeklyPlan.innerHTML = `

                    <div class="meal-day">

                        <h3>
                            Not enough ingredients
                        </h3>

                        <h4>
                            Let's go back to your kitchen
                        </h4>

                        <p>
                            Add some ingredients such as chicken,
                            eggs, tomatoes, broccoli or potatoes.
                        </p>

                    </div>

                `;

            }


            /*
             * DISPLAY THE AVAILABLE MEALS
             */

            else {

                weekDescription.textContent =
                    "These meals were created from the ingredients currently in your kitchen.";


                const days = [
                    "Monday",
                    "Tuesday",
                    "Wednesday",
                    "Thursday",
                    "Friday"
                ];


                const numberOfMeals =
                    Math.min(
                        possibleMeals.length,
                        days.length
                    );


                for (
                    let i = 0;
                    i < numberOfMeals;
                    i++
                ) {

                    const meal =
                        possibleMeals[i];


                    const mealCard =
                        document.createElement("div");


                    mealCard.className =
                        "meal-day";


                    mealCard.innerHTML = `

                        <h3>
                            ${days[i]}
                        </h3>

                        <h4>
                            ${meal.title}
                        </h4>

                        <p>
                            ${meal.description}
                        </p>

                        <small>
                            ${meal.ingredients}
                        </small>

                    `;


                    weeklyPlan.appendChild(
                        mealCard
                    );

                }

            }

        }

    </script>

</body>

</html>
