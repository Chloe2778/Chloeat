<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Kitchen | Chloeat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Chloe<span>at</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
        </nav>

    </header>


    <main>

        <section class="kitchen-page">

            <div class="section-header">

                <p class="small-title">STEP 4</p>

                <h1>Here's what you have.</h1>

                <p>
                    These are the groceries currently in your kitchen.
                </p>

            </div>


            <div
                class="inventory"
                id="inventory"
            >

                <!-- Groceries will be added here by JavaScript -->

            </div>


            <a
                href="week.html"
                class="plan-button"
            >
                Create my weekly plan
            </a>

        </section>

    </main>


    <footer>

        <p>
            Made with care by Chloeat
        </p>

    </footer>


    <script>

        /*
         * GET THE GROCERIES SAVED ON THE REVIEW PAGE
         */

        const savedGroceries =
            localStorage.getItem("groceries");


        const inventory =
            document.getElementById("inventory");


        /*
         * DISPLAY THE GROCERIES
         */

        if (savedGroceries) {

            const groceries =
                JSON.parse(savedGroceries);


            groceries.forEach(function (grocery) {

                const item =
                    document.createElement("div");


                item.className =
                    "inventory-item";


                item.innerHTML = `

                    <h3>
                        ${grocery.name}
                    </h3>

                    <p>
                        ${grocery.quantity}
                    </p>

                `;


                inventory.appendChild(item);

            });

        }


        /*
         * IF THERE ARE NO GROCERIES
         */

        if (
            !savedGroceries ||
            JSON.parse(savedGroceries).length === 0
        ) {

            inventory.innerHTML = `

                <p class="empty-kitchen">
                    Your kitchen is empty.
                    Go back and add some groceries.
                </p>

            `;

        }

    </script>

</body>

</html>
