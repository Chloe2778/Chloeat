<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Kitchen | Chloeat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Chloe<span>at</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
        </nav>

    </header>


    <main>

        <section class="kitchen-page">

            <div class="section-header">

                <p class="small-title">STEP 4</p>

                <h1>Here's what you have.</h1>

                <p>
                    These are the groceries currently in your kitchen.
                    You can edit, remove, or add anything before planning your week.
                </p>

            </div>


            <!-- ==============================
                 GROCERY LIST
            ============================== -->

            <div
                class="inventory"
                id="inventory"
            >

            </div>


            <!-- ==============================
                 ADD GROCERY
            ============================== -->

            <button
                type="button"
                class="add-item-button"
                id="add-grocery"
            >
                + Add grocery
            </button>


            <!-- ==============================
                 WEEKLY PLAN BUTTON
            ============================== -->

            <a
                href="week.html"
                class="plan-button"
                id="plan-button"
            >
                Create my weekly plan
            </a>

        </section>

    </main>


    <footer>

        <p>
            Made with care by Chloeat
        </p>

    </footer>


    <script>

        /*
         * GET SAVED GROCERIES
         */

        let groceries = [];

        const savedGroceries =
            localStorage.getItem("groceries");


        if (savedGroceries) {

            groceries =
                JSON.parse(savedGroceries);

        }


        /*
         * DISPLAY GROCERIES
         */

        const inventory =
            document.getElementById("inventory");


        function displayGroceries() {

            inventory.innerHTML = "";


            /*
             * EMPTY KITCHEN
             */

            if (groceries.length === 0) {

                inventory.innerHTML = `

                    <p class="empty-kitchen">
                        Your kitchen is empty.
                        Add some groceries to get started.
                    </p>

                `;

                return;

            }


            /*
             * CREATE EACH GROCERY CARD
             */

            groceries.forEach(function (grocery, index) {

                const item =
                    document.createElement("div");


                item.className =
                    "inventory-item";


                item.innerHTML = `

                    <div class="kitchen-item-content">

                        <input
                            class="kitchen-name"
                            type="text"
                            value="${grocery.name}"
                            data-index="${index}"
                        >

                        <input
                            class="kitchen-quantity"
                            type="text"
                            value="${grocery.quantity}"
                            data-index="${index}"
                        >

                    </div>


                    <button
                        type="button"
                        class="kitchen-remove"
                        data-index="${index}"
                    >
                        Remove
                    </button>

                `;


                inventory.appendChild(item);

            });


            /*
             * REMOVE BUTTONS
             */

            const removeButtons =
                document.querySelectorAll(".kitchen-remove");


            removeButtons.forEach(function (button) {

                button.addEventListener("click", function () {

                    const index =
                        Number(button.dataset.index);


                    groceries.splice(index, 1);


                    localStorage.setItem(
                        "groceries",
                        JSON.stringify(groceries)
                    );


                    displayGroceries();

                });

            });


            /*
             * NAME EDITING
             */

            const nameInputs =
                document.querySelectorAll(".kitchen-name");


            nameInputs.forEach(function (input) {

                input.addEventListener("change", function () {

                    const index =
                        Number(input.dataset.index);


                    groceries[index].name =
                        input.value.trim();


                    localStorage.setItem(
                        "groceries",
                        JSON.stringify(groceries)
                    );

                });

            });


            /*
             * QUANTITY EDITING
             */

            const quantityInputs =
                document.querySelectorAll(".kitchen-quantity");


            quantityInputs.forEach(function (input) {

                input.addEventListener("change", function () {

                    const index =
                        Number(input.dataset.index);


                    groceries[index].quantity =
                        input.value.trim();


                    localStorage.setItem(
                        "groceries",
                        JSON.stringify(groceries)
                    );

                });

            });

        }


        /*
         * ADD GROCERY BUTTON
         */

        const addGroceryButton =
            document.getElementById("add-grocery");


        addGroceryButton.addEventListener("click", function () {

            groceries.push({

                name: "New grocery",

                quantity: ""

            });


            localStorage.setItem(
                "groceries",
                JSON.stringify(groceries)
            );


            displayGroceries();

        });


        /*
         * FIRST DISPLAY
         */

        displayGroceries();

    </script>

</body>

</html>
