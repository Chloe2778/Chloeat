<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reading Your Receipt | Chloeat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Chloe<span>at</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
        </nav>

    </header>

    <main>

        <section class="processing-page">

            <div class="processing-icon">
                ✦
            </div>

            <p class="small-title">
                RECEIPT SCAN
            </p>

            <h1 id="processing-title">
                Reading your receipt...
            </h1>

            <p
                class="processing-text"
                id="processing-message"
            >
                Chloeat is identifying the groceries on your receipt.
            </p>

            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </section>

    </main>

    <footer>
        <p>
            Made with care by Chloeat
        </p>
    </footer>

    <script>

        const processingTitle =
            document.getElementById(
                "processing-title"
            );

        const processingMessage =
            document.getElementById(
                "processing-message"
            );

        const receiptImage =
            localStorage.getItem(
                "receiptImage"
            );

        if (!receiptImage) {

            processingTitle.textContent =
                "No receipt found.";

            processingMessage.textContent =
                "Please go back and upload a receipt first.";

            throw new Error(
                "No receipt image found."
            );
        }

        async function analyzeReceipt() {

            try {

                processingTitle.textContent =
                    "Reading your receipt...";

                processingMessage.textContent =
                    "Chloeat is identifying the groceries on it.";

                const response =
                    await fetch(
                        "https://chloeat.vercel.app/api/scan-receipt",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                image:
                                    receiptImage
                            })
                        }
                    );

                const data =
                    await response.json();

                console.log(
                    "Backend response:",
                    data
                );

                if (!response.ok) {

                    throw new Error(
                        JSON.stringify(data)
                    );
                }

                if (
                    !data.groceries ||
                    !Array.isArray(
                        data.groceries
                    )
                ) {

                    throw new Error(
                        "The AI returned an invalid grocery list."
                    );
                }

                localStorage.setItem(
                    "groceries",
                    JSON.stringify(
                        data.groceries
                    )
                );

                localStorage.setItem(
                    "aiReceiptResult",
                    JSON.stringify(data)
                );

                processingTitle.textContent =
                    "Your groceries are ready!";

                processingMessage.textContent =
                    "Chloeat found the items on your receipt.";

                setTimeout(function () {

                    window.location.href =
                        "scan-review.html";

                }, 700);

            }

            catch (error) {

                console.error(
                    "Receipt analysis error:",
                    error
                );

                processingTitle.textContent =
                    "Something went wrong.";

                processingMessage.textContent =
                    error.message;

            }
        }

        analyzeReceipt();

    </script>

</body>

</html>
