<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reading your receipt | Chloeat</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Chloe<span>at</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
        </nav>

    </header>


    <main>

        <section class="processing-page">

            <div class="processing-icon">
                ✿
            </div>

            <p class="small-title">
                READING YOUR RECEIPT
            </p>

            <h1 id="processing-title">
                Preparing your receipt...
            </h1>

            <p
                class="processing-text"
                id="processing-message"
            >
                We're getting everything ready.
            </p>

            <div class="loading-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </section>

    </main>


    <footer>
        Made with care by Chloeat
    </footer>


    <script>

        const receiptImage =
            localStorage.getItem("receiptImage");


        const title =
            document.getElementById(
                "processing-title"
            );


        const message =
            document.getElementById(
                "processing-message"
            );


        if (!receiptImage) {

            title.textContent =
                "No receipt found.";

            message.textContent =
                "Please go back and upload a receipt.";

        }

        else {

            readReceipt();

        }


        async function readReceipt() {

            try {

                title.textContent =
                    "Reading your receipt...";

                message.textContent =
                    "We're looking for the text on your receipt.";


                const worker =
                    await Tesseract.createWorker(
                        "eng",
                        1,
                        {
                            logger: function (info) {

                                console.log(info);

                            }
                        }
                    );


                title.textContent =
                    "Finding your groceries...";

                message.textContent =
                    "We're reading the items on your receipt.";


                const result =
                    await worker.recognize(
                        receiptImage
                    );


                const receiptText =
                    result.data.text;


                console.log(
                    "REAL OCR TEXT:",
                    receiptText
                );


                /*
                 * SAVE ONLY THE OCR RESULT
                 */

                localStorage.setItem(
                    "receiptText",
                    receiptText
                );


                /*
                 * REMOVE ANY OLD GROCERY DATA
                 */

                localStorage.removeItem(
                    "groceries"
                );


                await worker.terminate();


                title.textContent =
                    "Receipt scanned!";

                message.textContent =
                    "Let's check what Chloeat found.";


                setTimeout(function () {

                    /*
                     * CACHE-BUST REVIEW PAGE
                     */

                    window.location.href = "scan-review.html";
                }, 1200);

            }


            catch (error) {

                console.error(
                    "OCR ERROR:",
                    error
                );


                title.textContent =
                    "We couldn't read the receipt.";

                message.textContent =
                    "Please try taking a clearer photo and try again.";

            }

        }

    </script>

</body>

</html>
