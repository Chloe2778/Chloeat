<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reading your receipt | Chloeat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            Chloe<span>at</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>


    <main>

        <section class="processing-page">

            <div class="processing-icon">
                ✿
            </div>

            <p class="small-title">JUST A MOMENT</p>

            <h1 id="processing-title">
                Uploading your receipt...
            </h1>

            <p class="processing-text" id="processing-message">
                We're getting your receipt ready.
            </p>

            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </section>

    </main>


    <footer>
        Made with care by Chloeat
    </footer>


    <script>

        const title = document.getElementById("processing-title");
        const message = document.getElementById("processing-message");

        const steps = [
            {
                title: "Uploading your receipt...",
                message: "We're getting your receipt ready."
            },
            {
                title: "Reading the items...",
                message: "We're looking for the groceries on your receipt."
            },
            {
                title: "Organizing your groceries...",
                message: "We're putting everything together."
            },
            {
                title: "Your receipt is ready!",
                message: "Let's check what we found."
            }
        ];

        let currentStep = 0;

        const processingTimer = setInterval(function () {

            currentStep++;

            if (currentStep < steps.length) {

                title.textContent = steps[currentStep].title;
                message.textContent = steps[currentStep].message;

            } else {

                clearInterval(processingTimer);

                window.location.href = "review.html";

            }

        }, 1200);

    </script>

</body>

</html>
